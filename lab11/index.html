<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/b7dc083fc7.js" crossorigin="anonymous"></script>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;

        font-family: Roboto;
    }
    .backgroundAnim {
        width: 810px;
        height: 310px;
        background-color: transparent;
        margin: 0 auto;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
    }

    /* Linia aurie care merge de jur împrejur */
    .backgroundAnim::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: calc(2 * (810px + 310px));
        height: 100px; /* grosimea liniei */
        width: 100px;
        /* background: gold; */
        border: 10px solid gold;
        /* box-shadow: 0 0 8px gold; */
        border-color:  solid gold;
        animation: moveLine 4s linear infinite;
    }

    @keyframes moveLine {
        0% { 
            transform: translate(0, 0); 
        }
        40% { 
            transform: translate(690px, 0);
        }
        50% { 
            transform: translate(690px, 190px); 
        }
        90% { 
            transform: translate(0, 190px); 
        }
        100% { 
            transform: translate(0, 0); 
        }
    }

    .background{
        /* opacity: 0; */
        width: 800px;
        height: 300px;
        background-color: black;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translateY(-50%) translateX(-50%);
        
        overflow: hidden;


        display: flex;

        .box1{
            width: 300px;
            height: 100px;
            background-color: gold;
            transform: rotate(60deg);
            position: absolute;
            top: 200px;
            left: -170px;
        }
    }
    .text{

        

        width: 55%;
        height: 100%;
        color: white;
        font-size: 30px;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: start;
        flex-direction: column;
        overflow: hidden;
    
        background-color: rgb(7, 7, 7);

        hr{
            width: 50px;
            height: 4px;
            border: 0px;
            background-color: white;
            margin-bottom: 20px;
            margin-top: 20px;
            margin-left: 80px;
            
            opacity: 0;
            animation: move 1s 0.2s ease-in-out forwards;
        }
        i{
            opacity: 0;
            animation: move 1s ease-in-out forwards;


            color: gold;
            margin-left: 80px;
        }

        h2,h3{
            color: gold;
            height: 50px;
        }
        h2{
            opacity: 0;
            animation: move 1s 0.4s ease-in-out forwards;
        }
        h3{
            color: white;
            opacity: 0;
            animation: move 1s 0.5s ease-in-out forwards;
        }
        p{
            font-size: 10px;
            color: gray;
            height: 50px;
            margin-top: 10px;

            opacity: 0;
            animation: move 1s 0.6s ease-in-out forwards;
            
        }

        >div{
            width: 100%;
            margin-left: 100px;
            text-align: left;
            transform: translateX(-20px);

            >div{
                height: 20px;
                width: 250px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-left: 0px;
                
                
                i{
                    margin-left: 0px;
                    margin-top: 0px;
                    font-size: 16px;

                    opacity: 0;
                    animation: move 1s 0.7s ease-in-out forwards;
                }
                p{
                    margin-top: 0px;
                    /* margin-left: 20px; */
                    height: 14px;
                    opacity: 0;
                    animation: move 1s 0.8s ease-in-out forwards;
                }
            }
        }

        

    }
    .image {
        width: 47%;
        height: 100%;
        position: relative;
        overflow: hidden;
        

        
    }

    .image::before {
        content: "";
        background-color: rgb(7, 7, 7);
        height: 100px;
        width: 800px;
        transform: rotate(60deg);
        position: absolute;
        top: -50px;
        right: -390px;

    }

    /* a doua formă */
    .image::after {
        content: "";
        background-color: rgb(7, 7, 7);
        height: 160px;
        width: 800px;
        transform: rotate(60deg);
        position: absolute;
        top: -50px;
        right: 30px;
    }

    .image img {
        height: 300px;
    }

    
    .animbox {
        width: 300px;
        height: 300px;
        background-color: transparent;
        position: absolute;
        right: -24px;
        transform: skew(30deg);
        z-index: 1;
        overflow: visible;

        
    }
/* 
    .animbox::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 10px solid gold;
        box-sizing: border-box;
        animation: borderLoop 3s linear infinite;
        filter: drop-shadow(0 0 8px gold);
    }

    @keyframes borderLoop {
        0% {
            clip-path: inset(0 0 100% 0);
        }
        25% {
            clip-path: inset(0 0 0 100%);
        }
        50% {
            clip-path: inset(100% 0 0 0);
        }
        75% {
            clip-path: inset(0 100% 0 0);
        }
        100% {
            clip-path: inset(0 0 100% 0);
        }
    } */


    @keyframes move {
        0%{
            transform: translateX(-100px);
        }
        100%{
            transform: translateX(0px);
            opacity: 1;
        }
    }
</style>
<body>
    <div class="backgroundAnim">

    </div>
    <div class="background">
        <div class="box1"></div>
        <div class="text">
            <i class="fa-solid fa-paper-plane"></i>
            <hr>
            <div>
                <h2>Digital Marketing</h2>
                <h3>Agency</h3>
                <p>Lorem ipsum, dolor sit amet consectetur adipisicing  Odio inventore <br> sapiente in sunt consequuntur qui rem dolore accusantium, esse alias.</p>
                <div>
                    <i class="fa-solid fa-phone-flip"></i>
                    <p>+123 456 7890</p>
                    <i class="fa-solid fa-link"></i>
                    <p>website.com</p>
                </div>
            </div>

        </div>
        <div class="image">
            <div class="animbox"></div>
            <img src="https://static.vecteezy.com/system/resources/previews/002/098/391/large_2x/professional-working-on-laptop-and-phone-free-photo.jpg" alt="">
        </div>

    </div>
</body>
</html>
