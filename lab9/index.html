<!-- 
Modificați codul sursă al animației elaborate pentru a adăuga diverse efecte creative, de exemplu:
1. Cerculețele să fie generate cu culori diferite. 
2. Culoarea cerculețelor să poată fi selectată de către utilizator printr-un input.
3. Figurile să fie generate cu forme diferite.
4. Forma figurilor să poată fi selectată de către utilizator printr-un input.
5. La click pe ecran forma figurilor generate să se schimbe.
6. Formele să difere în funcție de mișcarea ce le generează (exe: la click apar triunghiuri, la mousemove - pătrate etc.) -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    p,label{
        margin-left: 15px;
    }
    canvas
    {
        border: 1px solid black;
    }
    .canva{
        text-align: center;
        position: relative; 
    }
    input[type="range"]{
        width: 300px;
        height: 8px;
        background: #ff6b6b;
        outline: none;
        border-radius: 5px;
        -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb{
        appearance: none;
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #ff0000;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    input[type="range"]::-moz-range-thumb{
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: #ff0000;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    input[type="range"]::-moz-range-track{
        background: #ff6b6b;
        border-radius: 5px;
        
    }
    #fullscreenBtn{
        position: absolute; 
        top: 12px;
        right: 12px;
        z-index: 9999;
        background: rgba(20, 20, 20, 0.5);
        color: #ffffff;
        border: 1px solid rgba(232, 232, 232, 0.2);
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        backdrop-filter: blur(4px);


        transform: translateX(-20px);

        
    }
    #fullscreenBtn:hover{ background: rgba(144, 144, 144, 0.12); }

</style>
<body>
    <div>
        
        <label for="colorPicker">Alege culoarea:</label>
        <select id="colorPicker">
            <option value="random">Random</option>
            <option value="purple">Purple</option>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="orange">Orange</option>
            <option value="yellow">Yellow</option>
        </select>



        <label for="shapePicker">Alege figura:</label>
        <select id="shapePicker">
            <option value="random">Random</option>
            <option value="glitch">Glitch</option>
            <option value="circle">Cerc</option>
            <option value="square">Pătrat</option>
            <option value="triangle">Triunghi</option>
        </select>

        
        <label for="mirrorPicker">Oglindire trasee:</label>
        <select id="mirrorPicker">
            <option value="none">Niciuna</option>
            <option value="vertical">Verticală</option>
            <option value="horizontal">Orizontală</option>
            <option value="both">Ambele</option>
        </select>
        <label for="backgroundPicker">Background canvas:</label>
        <select id="backgroundPicker">
            <option value="white">Alb</option>
            <option value="black">Negru</option>
        </select>
        <br>
        <label for="spawnClickPicker">Spawn la click:</label>
        <input type="range" id="spawnClickPicker" min="1" max="200" step="1" value="50">
        <span id="spawnClickValue">50</span>
        <br>
        <label for="spawnMovePicker">Spawn la mousemove:</label>
        <input type="range" id="spawnMovePicker" min="1" max="20" step="1" value="2">
        <span id="spawnMoveValue">2</span>
        <br>
        <label for="speedPicker">Viteza particulelor:</label>
        <input type="range" id="speedPicker" min="0.1" max="3" step="0.1" value="1">
        <span id="speedValue">1.0×</span>
        <br>
        <label for="opacityPicker">Alege opacitatea</label>
        <input type="range" name="opacityPicker" id="opacityPicker" value="0.3" min="0.1" max="1" step="0.1">
        <br>
        <label for="glowToggle"> Glow effect</label>
        
        <label for="glowPicker"><input type="checkbox" id="glowToggle">Intensitate glow</label>
        <input type="range" id="glowPicker" min="0" max="40" step="1" value="10">
        <span id="glowValue">10</span>

    </div>

    <div class="canva" id="fsWrapper">
        <canvas></canvas>
        <button id="fullscreenBtn" title="Toggle fullscreen">Enter Fullscreen</button>
    </div>

    <p>Cozma Vasile P-2241</p>

    <script>
        document.querySelector("#colorPicker").addEventListener("change", function(){
            if(this.value == "random"){
                selectedColor = 'random';
                return;
            }
            selectedColor = this.value;
        });
        document.querySelector("#shapePicker").addEventListener("change", function(){
            if(this.value == "random"){
                
                selectedShape = 'random';
                return;
            }
            selectedShape = this.value;
        });
        document.querySelector("#opacityPicker").addEventListener("change", function(){
            opacityValue = parseFloat(this.value);
        });
        document.querySelector("#mirrorPicker").addEventListener("change", function(){
            selectedMirror = this.value;
        });

        
        document.querySelector('#spawnClickPicker').addEventListener('input', function(){
            spawnClick = parseInt(this.value, 10) || 1;
            document.getElementById('spawnClickValue').textContent = spawnClick;
        });
        document.querySelector('#spawnMovePicker').addEventListener('input', function(){
            spawnMove = parseInt(this.value, 10) || 1;
            document.getElementById('spawnMoveValue').textContent = spawnMove;
        });
        document.querySelector('#speedPicker').addEventListener('input', function(){
            speedMultiplier = parseFloat(this.value) || 1;
            document.getElementById('speedValue').textContent = speedMultiplier.toFixed(1) + '×';
        });
        document.querySelector('#glowToggle').addEventListener('change', function(){
            glowEnabled = this.checked;
        });
        document.querySelector('#glowPicker').addEventListener('input', function(){
            glowValue = parseInt(this.value, 10) || 0;
            document.getElementById('glowValue').textContent = glowValue;
        });
        document.querySelector('#backgroundPicker').addEventListener('change', function(){
            selectedBackground = this.value;
            canvas.style.backgroundColor = selectedBackground;
        });
        
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', async function(){
            try{
                const wrapper = document.getElementById('fsWrapper');
                if(!document.fullscreenElement){
                    await wrapper.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch(err){ console.error('FS error', err); }
        });

        

        
        document.addEventListener('fullscreenchange', function(){
            if(document.fullscreenElement){
                fullscreenBtn.textContent = 'Exit Fullscreen';
                
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                isFullscreen = true;
            } else {
                fullscreenBtn.textContent = 'Enter Fullscreen';
                isFullscreen = false;
               
                canvas.width = window.innerWidth - 30;
                canvas.height = window.innerHeight - 140;
            }
        });
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        const canvas = document.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const particle = [];
        let selectedColor = 'random';
        let selectedShape = 'random';
        let opacityValue = 0.3;
        let selectedMirror = 'none';
        let spawnClick = 50;
        let spawnMove = 2;
        let speedMultiplier = 1;
        let glowEnabled = false;
        let glowValue = 10;
        let selectedBackground = 'white';
        let isFullscreen = false;
       

         
        canvas.width = window.innerWidth - 30;
        canvas.height = window.innerHeight - 140;
        
        canvas.style.backgroundColor = selectedBackground;

        window.addEventListener('resize', function(){
            canvas.width = window.innerWidth - 30;
            canvas.height = window.innerHeight - 140;
        });

        const mouse = {
            x: undefined,
            y: undefined,
        }

        canvas.addEventListener('click', function(mouseclick){
            
            if(isFullscreen){
                mouse.x = mouseclick.x;
                mouse.y = mouseclick.y;
            }
            else{
                mouse.x = mouseclick.x;
                mouse.y = mouseclick.y - 140;
            }



            for (let j = 0; j<spawnClick; j++){
                let bubble = new Bubble();
                bubble.speedX = (Math.random()-0.5)*20 * speedMultiplier;
                bubble.speedY = (Math.random()-0.5)*20 * speedMultiplier;
                bubble.size = Math.random()*60 + 20;
                particle.push(bubble);

                if(selectedMirror === 'vertical' || selectedMirror === 'both'){
                    let mb = new Bubble();
                    mb.speedX = -bubble.speedX;
                    mb.speedY = bubble.speedY;
                    mb.size = bubble.size;
                    mb.color = bubble.color;
                    mb.rotation = bubble.rotation;
                    mb.rotationSpeed = bubble.rotationSpeed;
                    mb.shape = bubble.shape;
                    mb.x = canvas.width - bubble.x;
                    mb.y = bubble.y;
                    particle.push(mb);
                }
                if(selectedMirror === 'horizontal' || selectedMirror === 'both'){
                    let mb2 = new Bubble();
                    mb2.speedX = bubble.speedX;
                    mb2.speedY = -bubble.speedY;
                    mb2.size = bubble.size;
                    mb2.color = bubble.color;
                    mb2.rotation = -bubble.rotation;
                    mb2.rotationSpeed = -bubble.rotationSpeed;
                    mb2.shape = bubble.shape;
                    mb2.x = bubble.x;
                    mb2.y = canvas.height - bubble.y;
                    particle.push(mb2);
                }
                if(selectedMirror === 'both'){
                    let mb3 = new Bubble();
                    mb3.speedX = -bubble.speedX;
                    mb3.speedY = -bubble.speedY;
                    mb3.size = bubble.size;
                    mb3.color = bubble.color;
                    mb3.rotation = -bubble.rotation;
                    mb3.rotationSpeed = -bubble.rotationSpeed;
                    mb3.shape = bubble.shape;
                    mb3.x = canvas.width - bubble.x;
                    mb3.y = canvas.height - bubble.y;
                    particle.push(mb3);
                }
                if(selectedMirror === 'both'){
                    let mb3 = new Bubble();
                    mb3.speedX = -bubble.speedX;
                    mb3.speedY = -bubble.speedY;
                    mb3.size = bubble.size;
                    mb3.color = bubble.color;
                    mb3.rotation = -bubble.rotation;
                    mb3.rotationSpeed = -bubble.rotationSpeed;
                    mb3.shape = bubble.shape;
                    mb3.x = canvas.width - bubble.x;
                    mb3.y = canvas.height - bubble.y;
                    particle.push(mb3);
                }
                if(selectedMirror === 'both'){
                    let mb3 = new Bubble();
                    mb3.speedX = -bubble.speedX;
                    mb3.speedY = -bubble.speedY;
                    mb3.size = bubble.size;
                    mb3.color = bubble.color;
                    mb3.rotation = -bubble.rotation;
                    mb3.rotationSpeed = -bubble.rotationSpeed;
                    mb3.shape = bubble.shape;
                    mb3.x = canvas.width - bubble.x;
                    mb3.y = canvas.height - bubble.y;
                    particle.push(mb3);
                }
            }
        })

        canvas.addEventListener('mousemove', function(mouseclick){
            
            
        
            if(isFullscreen){
                mouse.x = mouseclick.x;
                mouse.y = mouseclick.y;
            }
            else{
                mouse.x = mouseclick.x;
                mouse.y = mouseclick.y - 140;
            }
            
            for (let j = 0; j<spawnMove; j++){
                let bubble = new Bubble();
                bubble.speedX *= speedMultiplier;
                bubble.speedY *= speedMultiplier;
                particle.push(bubble);

                if(selectedMirror === 'vertical' || selectedMirror === 'both'){
                    let mb = new Bubble();
                    mb.speedX = -bubble.speedX;
                    mb.speedY = bubble.speedY;
                    mb.size = bubble.size;
                    mb.color = bubble.color;
                    mb.rotation = bubble.rotation;
                    mb.rotationSpeed = bubble.rotationSpeed;
                    mb.shape = bubble.shape;
                    mb.x = canvas.width - bubble.x;
                    mb.y = bubble.y;
                    particle.push(mb);
                }
                if(selectedMirror === 'horizontal' || selectedMirror === 'both'){
                    let mb2 = new Bubble();
                    mb2.speedX = bubble.speedX;
                    mb2.speedY = -bubble.speedY;
                    mb2.size = bubble.size;
                    mb2.color = bubble.color;
                    mb2.rotation = -bubble.rotation;
                    mb2.rotationSpeed = -bubble.rotationSpeed;
                    mb2.shape = bubble.shape;
                    mb2.x = bubble.x;
                    mb2.y = canvas.height - bubble.y;
                    particle.push(mb2);
                }
            }
        })

        function getGlowScale(){
            const count = particle.length;
            if(count < 300) return 1.0;      // full glow
            if(count < 800) return 0.6;      // reduced glow
            return 0.35;                     // low glow when many particles
        }

        class Bubble{
            constructor(){
                this.x=mouse.x;
                this.y=mouse.y;
                this.size=Math.random()*40;
                this.speedX=(Math.random()-0.5)*5;
                this.speedY=(Math.random()-0.5)*5;
                this.rotation=Math.random()*Math.PI*2;
                this.rotationSpeed=Math.random()*0.1-0.05;

                if(selectedColor != 'random'){
                    this.color = selectedColor;
                }
                else{
                    this.color = this.generateRandomColor();
                }

                if(selectedShape == 'random'){
                    this.shape = Math.floor(Math.random() * 3);
                }
                else if(selectedShape == 'glitch'){
                    this.shape = 'glitch';
                }
                else{
                    this.shape = selectedShape;
                }


            }
            generateRandomColor(){
                const letters = '0123456789ABCDEF';
                let color = '#';
                for (let i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 16)];
                }
                return color;
            }
            update(){
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                if(this.size>0.2) this.size -= 0.1;
            }
            draw(){
                let shapeType;
                
                if(this.shape === 'glitch'){
                    shapeType = Math.floor(Math.random() * 3);
                }
                else if(this.shape === 0 || this.shape === 'circle'){
                    shapeType = 0;
                }
                else if(this.shape === 1 || this.shape === 'square'){
                    shapeType = 1;
                }
                else{
                    shapeType = 2;
                }

                if(shapeType === 1){
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    const effGlow = glowEnabled ? Math.round(glowValue * getGlowScale()) : 0;
                    if(effGlow > 0){
                        ctx.shadowColor = this.color;
                        ctx.shadowBlur = effGlow;
                    } else {
                        ctx.shadowBlur = 0;
                    }
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = opacityValue;
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    ctx.restore();
                    return;
                }
                else if(shapeType === 2){
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    const effGlow = glowEnabled ? Math.round(glowValue * getGlowScale()) : 0;
                    if(effGlow > 0){
                        ctx.shadowColor = this.color;
                        ctx.shadowBlur = effGlow;
                    } else {
                        ctx.shadowBlur = 0;
                    }
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = opacityValue;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(this.size, 0);
                    ctx.lineTo(this.size/2, -this.size);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    return;
                }
                else{
                    ctx.save();
                    const effGlow = glowEnabled ? Math.round(glowValue * getGlowScale()) : 0;
                    if(effGlow > 0){
                        ctx.shadowColor = this.color;
                        ctx.shadowBlur = effGlow;
                    } else {
                        ctx.shadowBlur = 0;
                    }
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = opacityValue;
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);             
                    ctx.fill();
                    ctx.restore();
                    return;
                }
            }
        }

        function init(){
            for (let i = 0; i<100; i++){
                particle.push(new Bubble());
            }
        }
        init();

        function drawParticle(){
            for (let i = 0; i < particle.length; i++){
                particle[i].update();
                particle[i].draw();
                if(particle[i].size<=0.2){
                    particle.splice(i,1);
                    i--;
                }
            }
        }
        function animate(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            drawParticle();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
