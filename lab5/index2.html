<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

    *{
        box-sizing: border-box;
        padding: 0;
        margin: 0;
    }
    body{
        background-color: #da3743;
    

    }


    .circle{
        background-color: white;
        height: 10vh;
        width: 10vh;
        border-radius: 100vw;
        position: absolute;

        top: 50%;
        left: 50%;
        transform: translateX(-400%) translateY(-50%);
    }   

   

    .disc{
        height: 40vh;
        width: 40vh;
        background-color: white;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);

        border-radius: 100vw;

        display: flex;
        justify-content: center;
        align-items: center;

        div{
            background-color: #da3743;
            height: 15vh;
            width: 15vh;
            border-radius: 100vw;
        }
    }

    .orbit{
        position: absolute;

        top: 45%;
        left: 45%;
        transform: translateX(-50%) translateY(-50%);


    }
    
    .orbit:nth-of-type(1){
        animation: anim1 4s 1 ease-in-out forwards;
       
    }
    .orbit:nth-of-type(2){
        animation: anim2 4s 1 ease-in-out forwards;
    }
    .orbit:nth-of-type(3){
        animation: anim3 4s 1 ease-in-out forwards;
    }
    .orbit:nth-of-type(4){
        animation: anim4 4s 1 ease-in-out forwards;
    }
    .orbit:nth-of-type(5){
        animation: anim5 4s 1 ease-in-out forwards;
    }
    .orbit:nth-of-type(6){
        animation: anim6 4s 1 ease-in-out forwards;
    }
    .orbit:nth-of-type(7){
        animation: anim7 4s 1 ease-in-out forwards;
    }
    .orbit:nth-of-type(8){
        animation: anim8 4s 1 ease-in-out forwards;
    }


    
    @keyframes anim1_2{
        from{
            /* transform: rotate(45deg); */
        }
        to{
            transform: rotate(360deg);
        }
        
    }

    @keyframes anim1{
        0%{
        }
        40%{
            transform: rotate(45deg);
        }
        80%{
            transform: rotate(45deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }

    @keyframes anim2{
        from{
            transform: rotate(0deg);
        }
        40%{
            transform: rotate(90deg);
        }
        80%{
            transform: rotate(90deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }

    @keyframes anim3{
        from{
            transform: rotate(0deg);
        }
        40%{
            transform: rotate(135deg);
        }
        80%{
            transform: rotate(135deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }
    @keyframes anim4{
        from{
            transform: rotate(0deg);
        }
        40%{
            transform: rotate(180deg);
        }
        80%{
            transform: rotate(180deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }
    @keyframes anim5{
        from{
            transform: rotate(0deg);
        }
        40%{
            transform: rotate(225deg);
        }
        80%{
            transform: rotate(225deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }
    @keyframes anim6{
        from{
            transform: rotate(0deg);
        }
        40%{
            transform: rotate(270deg);
        }
        80%{
            transform: rotate(270deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }
    @keyframes anim7{
        from{
            transform: rotate(0deg);
        }
        40%{
            transform: rotate(315deg);
        }
        80%{
            transform: rotate(315deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }
    @keyframes anim8{
        from{
            transform: rotate(0deg);
        }
        40%{
            transform: rotate(360deg);
        }
        80%{
            transform: rotate(360deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }

</style>
