function drawPolygon(points,fill){
    ctx.beginPath(); 
    ctx.fillStyle = fill;
    ctx.strokeStyle = 'black'; 
    ctx.lineWidth = 4;
    for(let i = 0; i < points.length; i+=2){
        if(i === 0){
            ctx.moveTo(points[i], points[i+1]);
        } else {
            ctx.lineTo(points[i], points[i+1]);
        }
    }            
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
}

function drawPolygon(points, fill, radius, lineWidth) {
    if (!radius) radius = 0;

    

    ctx.beginPath();
    ctx.fillStyle = fill;
    ctx.strokeStyle = 'black';
    ctx.lineWidth = lineWidth || 0;
    ctx.lineJoin = 'round';

    const n = points.length / 2;

    for (let i = 0; i < n; i++) {

        const prev = {
            x: points[((i - 1 + n) % n) * 2],
            y: points[((i - 1 + n) % n) * 2 + 1]
        };
        const curr = {
            x: points[i * 2],
            y: points[i * 2 + 1]
        };
        const next = {
            x: points[((i + 1) % n) * 2],
            y: points[((i + 1) % n) * 2 + 1]
        };

        const v1 = { x: prev.x - curr.x, y: prev.y - curr.y };
        const v2 = { x: next.x - curr.x, y: next.y - curr.y };

        const len1 = Math.hypot(v1.x, v1.y);
        const len2 = Math.hypot(v2.x, v2.y);

        const r = Math.min(radius, len1 / 2, len2 / 2);

        const p1 = {
            x: curr.x + (v1.x / len1) * r,
            y: curr.y + (v1.y / len1) * r
        };
        const p2 = {
            x: curr.x + (v2.x / len2) * r,
            y: curr.y + (v2.y / len2) * r
        };

        if (i === 0) {
            ctx.moveTo(p1.x, p1.y);
        } else {
            ctx.lineTo(p1.x, p1.y);
        }

        ctx.quadraticCurveTo(curr.x, curr.y, p2.x, p2.y);
    }

    ctx.closePath();
    ctx.fill();

    if (lineWidth){
        ctx.stroke();
    }
}

function drawCircle(x, y, radius, fill, lineWidth){
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 2 * Math.PI);
    ctx.fillStyle = fill;
    ctx.fill();
    if (lineWidth){
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = 'black';
        ctx.stroke();
    }
}

function drawLine(x1, y1, x2, y2, color, lineWidth){
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
}

function drawSmoothCurve(flatArray, thickness = 3, color = "#000") {
    const points = [];
    for (let i = 0; i < flatArray.length; i += 2) {
        points.push({ x: flatArray[i], y: flatArray[i + 1] });
    }

    if (points.length < 2) return;

    ctx.lineWidth = thickness;
    ctx.strokeStyle = color;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);

    for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;

        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }

    ctx.stroke();
}

            return { x: center.x + fx, y: center.y + fy - verticalBias };

            ctx.fillStyle = "black";

            const inner = radius * 0.55;
            const itop = [cx, cy - inner];

            const ibottom = [cx, cy + inner];
            const ileft = [cx - inner, cy];
            ctx.beginPath();
            ctx.moveTo(itop[0], itop[1]);
            ctx.lineTo(iright[0], iright[1]);
            ctx.lineTo(ibottom[0], ibottom[1]);
            ctx.lineTo(ileft[0], ileft[1]);
            ctx.closePath();
            ctx.fillStyle = 'white';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx - inner*0.25, cy - inner*0.25, Math.max(1, inner*0.18), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fill();

        drawDiamondPupil(pupilState.left.x, pupilState.left.y, 10.1);

function updateScratch(dt){
    if(scratch.phase === 'idle') return;

    if(scratch.phase === 'appearing'){
        scratch.progress += dt * 1.6;
        if(scratch.progress >= 1){
            scratch.progress = 1;
            scratch.phase = 'visible';
            scratch.visibleTimer = 0;
        }
    } else if(scratch.phase === 'visible'){
        scratch.visibleTimer += dt;
        if(scratch.visibleTimer >= scratch.visibleDuration){
            
        }
    } else if(scratch.phase === 'particles'){
        for(let i = scratch.particles.length - 1; i >= 0; i--){
            const p = scratch.particles[i];
            p.age += dt;
            if(p.age >= p.life){
                scratch.particles.splice(i,1);
                continue;
            }
            p.vx *= (1 - Math.min(0.08, dt * 2));
            p.vy += 300 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.alpha = Math.max(0, 1 - p.age / p.life);
        }

        if(scratch.particles.length === 0){
            scratch.phase = 'idle';
            scratch.progress = 0;
            scratch.visibleTimer = 0;
        }
    }
}

function drawScratch(){
    if(scratch.phase === 'idle') return;

    if(scratch.phase === 'appearing' || scratch.phase === 'visible'){
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.65 * scratch.progress;
        drawPolygon(scratch.pathPts, colors.purpleHair, 18, 2);

        ctx.globalAlpha = 0.9 * scratch.progress;
        ctx.lineWidth = 4 + 12 * scratch.progress;
        const pts = scratch.pathPts;
        ctx.beginPath();
        ctx.moveTo(pts[0], pts[1]);
        for(let i = 2; i < pts.length; i += 2){
            ctx.lineTo(pts[i], pts[i+1]);
        }
        
        ctx.restore();
    }

    if(scratch.phase === 'particles'){
        for(const p of scratch.particles){
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
}

function startExplosion(){
    scratch.phase = 'particles';
    scratch.particles = [];
    const N = 80;
    const pts = scratch.pathPts;
    for(let i = 0; i < N; i++){
        const idx = Math.floor(Math.random() * (pts.length/2 - 1));
        const x1 = pts[idx*2], y1 = pts[idx*2+1];
        const x2 = pts[(idx+1)*2], y2 = pts[(idx+1)*2+1];
        const t = Math.random();
        const x = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 6;
        const y = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 6;
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 300;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed - 60
        const life = 0.8 + Math.random() * 1.0;
        const r = 1 + Math.random() * 3;
        scratch.particles.push({ x, y, vx, vy, age: 0, life, r, alpha: 1, color: colors.purpleHair });
    }
}


let startTime = Date.now();
function animate() {
    const elapsed = (Date.now() - startTime) / 1000;
    const breathingOffset = Math.sin(elapsed * 1.5) * 6; // oscilare ± 6 pixeli
    const windOffset = Math.sin(elapsed * 0.8) * 8; // vânt oscilant ± 8 pixeli
    const earRotation = breathingOffset * 0.02; // rotația cerceilor
    
    currentBreathingOffset = breathingOffset;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const now = Date.now();
    const dt = (now - lastFrame) / 1000;
    lastFrame = now;

    ctx.save();
    ctx.translate(0, breathingOffset);
    drawBody();
    drawHead(windOffset, earRotation);

    updateScratch(dt);
    drawScratch();

    ctx.restore();

    requestAnimationFrame(animate);
}

window.addEventListener("click", () => {
    if(scratch.phase === 'idle'){
        scratch.phase = 'appearing';
        scratch.progress = 0;
        scratch.visibleTimer = 0;
    } else if(scratch.phase === 'visible'){
        startExplosion();
    }
});
